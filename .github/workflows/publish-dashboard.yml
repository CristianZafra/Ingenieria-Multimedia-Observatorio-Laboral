name: Publish dashboard

on:
  push:
    branches: [main]
    paths:
      - 'payload/**'
      - '.github/workflows/publish-dashboard.yml'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Reconstruct exact HTML
        shell: bash
        run: |
          cat payload/part00.txt payload/part01.txt payload/part02.txt payload/part03.txt payload/part04_0.txt payload/part04_1.txt payload/part04_2.txt payload/part04_3.txt payload/part05.txt payload/part06.txt > dashboard.html.gz.b64
          base64 --decode dashboard.html.gz.b64 > dashboard.html.gz
          gzip --decompress --stdout dashboard.html.gz > index.html
          echo "d03c0c0a4f0c449fedc9cee3eb1550dbc053551e744d974e9994d6a5bd57e0a2  index.html" | sha256sum --check

      - name: Commit index.html to main
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if ! git diff --cached --quiet; then
            git commit -m "Publish labor observatory dashboard"
            git push origin main
          fi

      - name: Prepare Pages artifact
        shell: bash
        run: |
          mkdir -p _site
          cp index.html _site/index.html

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
